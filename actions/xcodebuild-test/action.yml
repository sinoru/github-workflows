name: Build and test with xcodebuild
description: >-
  Builds a scheme and its tests for a generic destination, in the configuration named, then
  runs the tests wherever a destination can be launched: the one given directly, or a simulator
  device found in the runtime named. A row that names neither stops after the build.

inputs:
  scheme:
    description: The scheme to build and test.
    required: true
  arguments:
    description: >-
      Further xcodebuild arguments, e.g. a `-project` and signing overrides for a scheme that
      lives in a project rather than the package.
    default: ""
  test-run-arguments:
    description: Further xcodebuild arguments for running the tests alone.
    default: ""
  configuration:
    description: The configuration to build and test, e.g. "Release".
    default: Debug
  only-testing:
    description: >-
      A pattern over suite type names. Only the suites it matches run; empty runs them all.
    default: ""
  skip-testing:
    description: A pattern over suite type names. The suites it matches do not run.
    default: ""
  destination:
    description: The generic destination to build for, e.g. "generic/platform=iOS Simulator".
    required: true
  test-destination:
    description: A destination xcodebuild can launch as is. Empty where a simulator is looked up.
    default: ""
  simulator-runtime:
    description: A CoreSimulator runtime identifier prefix to pick a device from. Empty for none.
    default: ""
  simulator-sdk:
    description: The simulator SDK whose version an unpinned runtime is matched to.
    default: ""
  download-platform:
    description: The platform to download when the runtime is pinned.
    default: ""
  download-version:
    description: The release to download when the runtime is pinned.
    default: ""

runs:
  using: composite
  steps:
    # build-for-testing rather than build: it compiles the test targets as well, and a generic
    # destination covers every architecture its SDK supports where the concrete one the run
    # below needs does not. The run reuses what was built here. The configuration is stated
    # rather than left to the scheme: nothing commits a scheme, so the one SwiftPM generates
    # would default both actions to Debug.
    - name: xcodebuild build-for-testing
      shell: bash
      env:
        SCHEME: ${{ inputs.scheme }}
        ARGUMENTS: ${{ inputs.arguments }}
        CONFIGURATION: ${{ inputs.configuration }}
        DESTINATION: ${{ inputs.destination }}
      run: |
        xcodebuild build-for-testing \
          -scheme "$SCHEME" $ARGUMENTS \
          -destination "$DESTINATION" \
          -configuration "$CONFIGURATION" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData"

    - uses: sinoru/github-workflows/actions/resolve-xcode-destination@main
      with:
        destination: ${{ inputs.test-destination }}
        simulator-runtime: ${{ inputs.simulator-runtime }}
        simulator-sdk: ${{ inputs.simulator-sdk }}
        download-platform: ${{ inputs.download-platform }}
        download-version: ${{ inputs.download-version }}

    # xcodebuild selects tests by `Target/Type` and takes no pattern, so a pattern is matched
    # against the test sources and each type it finds is named under the directory it is in,
    # which is its target. A list written out would be one more thing to forget when a suite
    # is added. A pattern that matches nothing is a mistake, not an empty selection, and fails
    # here rather than quietly running everything or nothing.
    - name: xcodebuild test-without-building
      shell: bash
      env:
        SCHEME: ${{ inputs.scheme }}
        ARGUMENTS: ${{ inputs.arguments }}
        TEST_RUN_ARGUMENTS: ${{ inputs.test-run-arguments }}
        CONFIGURATION: ${{ inputs.configuration }}
        ONLY: ${{ inputs.only-testing }}
        SKIP: ${{ inputs.skip-testing }}
      run: |
        if [ -z "$TEST_DESTINATION" ]; then
          echo "Nothing is attached to run these binaries on; the build is all this row does."
          exit 0
        fi

        suites() {
          local found
          found=$(grep -rEo "^(final )?(class|struct) [A-Za-z]+($2)\b" Tests \
            | sed -E 's|^Tests/([^/]+)/[^:]+:.* ([A-Za-z]+)$|\1/\2|' | sort -u)
          if [ -z "$found" ]; then echo "No suite matches $2." >&2; return 1; fi
          printf -- "$1:%s " $found
        }
        selection=""
        if [ -n "$ONLY" ]; then selection+=$(suites -only-testing "$ONLY") || exit 1; fi
        if [ -n "$SKIP" ]; then selection+=$(suites -skip-testing "$SKIP") || exit 1; fi

        xcodebuild test-without-building \
          -scheme "$SCHEME" $ARGUMENTS $TEST_RUN_ARGUMENTS \
          -destination "$TEST_DESTINATION" \
          -configuration "$CONFIGURATION" \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          $selection
